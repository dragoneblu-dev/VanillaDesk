<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VanillaDesk</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/ui-components.css">
    <link rel="stylesheet" href="css/colors.css">
    <link rel="stylesheet" href="css/editor.css">
    <link rel="stylesheet" href="css/widgets.css">
    <link rel="stylesheet" href="css/tables.css">
    <link rel="stylesheet" href="css/advanced-table.css">
    <link rel="stylesheet" href="css/advanced-table-board.css">
    <link rel="stylesheet" href="css/advanced-table-calendar.css">
    <link rel="stylesheet" href="css/advanced-table-timeline.css">
    <link rel="stylesheet" href="css/code.css">
    <link rel="stylesheet" href="css/modals.css">
    <link rel="stylesheet" href="graph/graph.css">
    
    <link rel="stylesheet" href="css/custom.css">

    <script src="js/icons.js"></script>
    <script src="js/i18n.js"></script>
</head>

<body class="light-theme">

    <div id="advCustomTooltip" class="adv-custom-tooltip"></div>

    <header>
        <div class="brand">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink:0;">
                <path
                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                </path>
            </svg>
            <div id="fileNameDisplay" class="brand-header-titles" onclick="UI.goHome()" style="cursor:pointer;" title="">
                <span class="header-workspace-name"><script>document.write(I18n.t('common.no_workspace'));</script></span>
                <span class="header-note-name"><script>document.write(I18n.t('home_dashboard.title')); document.getElementById('fileNameDisplay').title = I18n.t('toolbar.breadcrumb_home');</script></span>
            </div>
            <button id="editToggleBtn" class="btn" style="margin-left: 15px;" onclick="UI.toggleEditMode()">
                <script>document.write(Icons.edit)</script> <script>document.write(I18n.t('common.edit'))</script>
            </button>
            <span id="saveStatus" class="status-pill status-saved hidden"><script>document.write(I18n.t('common.saved'))</script></span>
        </div>

        <div class="controls-group">
            <div id="noteContextActions" style="display:flex; align-items:center; gap:8px;" class="hidden">
                
                <button class="icon-btn" onclick="UI.toggleMark()" id="markBtn">
                    <script>document.write(Icons.starEmpty); document.getElementById('markBtn').title = I18n.t('toolbar.favorite');</script>
                </button>
                <button id="btnNoteProperties" class="icon-btn">
                    <script>document.write(Icons.tag); document.getElementById('btnNoteProperties').title = I18n.t('toolbar.page_properties');</script>
                </button>
                <button id="btnNoteInfo" class="icon-btn" onclick="UI.openNoteInfoPanel()">
                    <script>document.write(Icons.info); document.getElementById('btnNoteInfo').title = I18n.t('toolbar.page_info');</script>
                </button>

                <!-- Pulsante Vista Grafo delle Connessioni -->
                <button class="icon-btn" id="graphViewBtn" onclick="UI.openGraphView()" title="Mappa delle Connessioni (Graph View)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="6" cy="6" r="3"></circle>
                        <circle cx="18" cy="6" r="3"></circle>
                        <circle cx="12" cy="18" r="3"></circle>
                        <line x1="8.5" y1="7.5" x2="15.5" y2="7.5"></line>
                        <line x1="7.5" y1="8.5" x2="10.5" y2="15.5"></line>
                        <line x1="16.5" y1="8.5" x2="13.5" y2="15.5"></line>
                    </svg>
                </button>
                <div class="separator"></div>
            </div>

            <!-- Controlli di Navigazione Cronologica e Gerarchica -->
            <div id="navHistoryControls" style="display:flex; align-items:center; gap:4px;">
                <button class="icon-btn" onclick="UI.navHistoryBack()" id="navBackBtn">
                    <script>document.write(Icons.navBack || Icons.arrowLeft); document.getElementById('navBackBtn').title = I18n.t('toolbar.nav_back') || 'Torna indietro (Alt+←)';</script>
                </button>
                <button class="icon-btn" onclick="UI.navHistoryForward()" id="navForwardBtn">
                    <script>document.write(Icons.navForward || Icons.arrowRight); document.getElementById('navForwardBtn').title = I18n.t('toolbar.nav_forward') || 'Vai avanti (Alt+→)';</script>
                </button>
                <button class="icon-btn" onclick="UI.goUpOneLevel()" id="goUpBtn">
                    <script>document.write(Icons.goUp || Icons.cornerUpLeft); document.getElementById('goUpBtn').title = I18n.t('toolbar.go_up');</script>
                </button>
                <div class="separator"></div>
            </div>

            <button class="icon-btn active" id="sidebarToggleBtn" onclick="UI.toggleSidebar()">
                <script>document.write(Icons.focus); document.getElementById('sidebarToggleBtn').title = I18n.t('toolbar.toggle_sidebar');</script>
            </button>
            
            <button class="icon-btn" id="minimapBtn" onclick="UI.toggleMinimap()">
                <script>document.write(Icons.minimap); document.getElementById('minimapBtn').title = I18n.t('toolbar.toggle_minimap');</script>
            </button>
            
            <div class="separator"></div>

            <div style="position: relative;" id="mainMenuWrapper">
                <button class="icon-btn main-menu-btn" id="mainMenuBtn" onclick="UI.toggleMainMenu(event)">
                    <script>document.getElementById('mainMenuBtn').title = I18n.t('toolbar.main_menu');</script>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <div class="layout">
        <aside id="sidebar">
            <div class="search-box">
                <div class="search-wrapper">
                    <input type="text" id="searchInput" class="search-input" autocomplete="off">
                    <script>document.getElementById('searchInput').placeholder = I18n.t('common.search_sidebar_placeholder');</script>
                    <div class="search-controls hidden" id="searchControls">
                        <span class="search-counter" id="searchCounter">0/0</span>
                        <button class="search-nav-btn" id="btnSearchPrev" onclick="AppState.findPrevious()">
                            <script>document.write(Icons.searchUp); document.getElementById('btnSearchPrev').title = I18n.t('toolbar.search_prev');</script>
                        </button>
                        <button class="search-nav-btn" id="btnSearchNext" onclick="AppState.findNext()">
                            <script>document.write(Icons.searchDown); document.getElementById('btnSearchNext').title = I18n.t('toolbar.search_next');</script>
                        </button>
                        <button id="searchClearBtn" class="search-clear-btn">✕</button>
                        <script>document.getElementById('searchClearBtn').title = I18n.t('toolbar.search_clear');</script>
                    </div>
                </div>
                <!-- Contenitore Filtri Attivi (Pills) -->
                <div id="activeSearchFilters" style="display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; padding:0 2px;"></div>
            </div>
            
            <div class="sidebar-tabs-container">
                <button class="sidebar-tab active" id="tab-notes" onclick="UI.switchToNotes()">
                    <script>document.getElementById('tab-notes').title = I18n.t('toolbar.tab_notes');</script>
                    <span class="menu-icon-svg" style="display:flex; width:16px; height:16px;"><script>document.write(Icons.file)</script></span>
                    <span class="tab-label"><script>document.write(I18n.t('toolbar.tab_notes'))</script></span>
                </button>
                <button class="sidebar-tab" id="tab-favorites" onclick="UI.toggleFavoritesInTree()">
                    <script>document.getElementById('tab-favorites').title = I18n.t('toolbar.tab_favorites');</script>
                    <span class="menu-icon-svg" style="display:flex; width:16px; height:16px;"><script>document.write(Icons.starEmpty)</script></span>
                    <span class="tab-label"><script>document.write(I18n.t('toolbar.tab_favorites'))</script></span>
                </button>
                <button class="sidebar-tab" id="tab-bookmarks" onclick="UI.toggleBookmarksInTree()">
                    <script>document.getElementById('tab-bookmarks').title = I18n.t('toolbar.tab_bookmarks');</script>
                    <span class="menu-icon-svg" style="display:flex; width:16px; height:16px;"><script>document.write(Icons.bookmark)</script></span>
                    <span class="tab-label"><script>document.write(I18n.t('toolbar.tab_bookmarks'))</script></span>
                </button>
                <button class="sidebar-tab" id="tab-databases" onclick="UI.toggleDbNotesInTree()">
                    <script>document.getElementById('tab-databases').title = I18n.t('toolbar.tab_databases');</script>
                    <span class="menu-icon-svg" style="display:flex; width:16px; height:16px;"><script>document.write(Icons.tableDatabase)</script></span>
                    <span class="tab-label"><script>document.write(I18n.t('toolbar.tab_databases'))</script></span>
                </button>

                <div class="sidebar-tools">
                    <button class="icon-btn" id="btnSideAddNote" onclick="UI.addNote(null)">+</button>
                    <script>document.getElementById('btnSideAddNote').title = I18n.t('toolbar.new_note');</script>
                </div>
            </div>

            <div id="treeContainer" class="tree-scroll" ondragover="UI.handleDragOverRoot(event)"
                ondrop="UI.handleDropRoot(event)">
            </div>
        </aside>

        <main id="mainArea">
            <div id="emptyState" class="empty-state">
                <div id="onboardingView" class="hidden" style="display:flex; flex-direction:column; align-items:center; max-width:700px; margin: 0 auto; text-align:center; padding-top: 40px;">
                    <div style="margin-bottom: 25px; color:var(--accent-color); transform: scale(1.8);">
                        <script>document.write(Icons.lightning || Icons.book)</script>
                    </div>
                    <h1 style="margin-bottom: 10px; font-size: 2.2rem; color: var(--text-primary);"><script>document.write(I18n.t('onboarding.title'))</script></h1>
                    <div style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: bold;">
                        Realizzato da dragoneblu@gmail.com
                    </div>
                    <p style="font-size:1.1rem; line-height:1.7; color:var(--text-secondary); margin-bottom: 35px;">
                        <script>document.write(I18n.t('onboarding.desc'))</script>
                    </p>
                    <div style="display:flex; gap:15px; justify-content:center; flex-wrap:wrap;">
                        <button class="btn" style="padding: 10px 20px; font-size: 1rem; border-color: var(--accent-color); color: var(--accent-color); font-weight: bold;" onclick="Store.createWorkspace(true)">
                            <span style="display:inline-block; margin-right:5px;">
                                <script>document.write(Icons.folderOpen)</script>
                            </span> <script>document.write(I18n.t('menu.new_workspace'))</script>
                        </button>
                        <button class="btn btn-primary" style="padding: 10px 20px; font-size: 1rem;" onclick="Store.openWorkspace()">
                            <span style="display:inline-block; margin-right:5px;">
                                <script>document.write(Icons.folder)</script>
                            </span> <script>document.write(I18n.t('menu.open_workspace'))</script>
                        </button>
                        <button id="btnRecoverSession" class="btn" style="padding: 10px 20px; font-size: 1rem; display:none;" onclick="Store.restoreRecoveredSession()">
                            <span style="display:inline-block; margin-right:5px;">
                                <script>document.write(Icons.restore)</script>
                            </span> <script>document.write(I18n.t('onboarding.btn_recover'))</script>
                        </button>
                    </div>
                </div>

                <div id="homeDocumentView" class="hidden"
                    style="width: 100%; max-width: var(--page-max-width, 900px); display:flex; flex-direction:column; gap:15px; margin: 0 auto; padding: 0 20px 40px 20px; box-sizing: border-box;">
                    <div
                        style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid var(--border-color); padding-bottom:15px;">
                        <h2 style="margin:0;"><script>document.write(I18n.t('home_dashboard.title'))</script></h2>
                        <button class="btn btn-primary" onclick="CitationManager.openModal(true)">+ <script>document.write(I18n.t('home_dashboard.add_citation'))</script></button>
                    </div>
                    <div id="homeCitationsContainer"
                        style="width:100%; display:flex; flex-direction:column; gap:10px; text-align:left;">
                    </div>
                    
                    <!-- Riquadro Globale Informazioni & Statistiche Workspace (in coda alle citazioni) -->
                    <div id="homeWorkspaceStatsContainer" style="width:100%; margin-top:20px;"></div>
                </div>

                <div id="readModeView" class="hidden" style="text-align:center; max-width:600px; margin-top: 50px;">
                    <div style="margin-bottom: 20px; color:var(--text-secondary);">
                        <script>document.write(Icons.lock)</script>
                    </div>
                    <h2><script>document.write(I18n.t('editor.read_mode_notice'))</script></h2>
                    <p><script>document.write(I18n.t('editor.read_mode_desc'))</script></p>
                </div>
            </div>

            <!-- EDITOR WRAPPER -->
            <div id="editorWrapper" class="editor-container hidden read-mode">
                
                <div id="editorToolbar" class="toolbar hidden">
                    
                    <div style="display:flex; gap:2px;">
                        <button id="btnUndo" onclick="Editor.undo()">
                            <script>document.write(Icons.undo); document.getElementById('btnUndo').title = I18n.t('toolbar.undo');</script>
                        </button>
                        <button id="btnRedo" onclick="Editor.redo()">
                            <script>document.write(Icons.redo); document.getElementById('btnRedo').title = I18n.t('toolbar.redo');</script>
                        </button>
                    </div>
                    <button id="btnClearFormat" onmousedown="event.preventDefault(); Editor.saveSelection();" onclick="Editor.clearFormatting()">
                        <script>document.write(Icons.eraser); document.getElementById('btnClearFormat').title = I18n.t('toolbar.eraser');</script>
                    </button>
                    
                    <div class="separator" style="height:38px;"></div>

                    <button id="btnFormatB" onclick="Editor.exec('bold')">
                        <script>document.getElementById('btnFormatB').title = I18n.t('toolbar.bold');</script><b>B</b>
                    </button>
                    <button id="btnFormatI" onclick="Editor.exec('italic')">
                        <script>document.getElementById('btnFormatI').title = I18n.t('toolbar.italic');</script><i>I</i>
                    </button>
                    <button id="btnFormatU" onclick="Editor.exec('underline')">
                        <script>document.getElementById('btnFormatU').title = I18n.t('toolbar.underline');</script><u>U</u>
                    </button>
                    <button id="btnFormatS" onclick="Editor.exec('strikeThrough')">
                        <script>document.getElementById('btnFormatS').title = I18n.t('toolbar.strikethrough');</script><s>S</s>
                    </button>
                    <button id="btnToggleCase" onclick="Editor.toggleCase()" style="margin-top: 3px;">
                        <script>document.write(Icons.caseToggle); document.getElementById('btnToggleCase').title = I18n.t('toolbar.toggle_case');</script>
                    </button>
                    
                    <div class="separator" style="height:38px;"></div>

                    <div class="color-picker-group">
                        <button class="btn-color-main" id="btnColorHlMain" onclick="ColorManager.applyLast('highlight')">
                            <script>document.getElementById('btnColorHlMain').title = I18n.t('toolbar.highlight_color');</script>
                            <span style="display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px;"><script>document.write(Icons.pen)</script></span>
                            <div id="hlBar" class="btn-color-bar hl-c5"></div>
                        </button>
                        <button id="btnHlMenu" class="btn-color-arrow" onclick="ColorManager.openColorMenu(event, 'btnHlMenu', 'highlight')">▼</button>
                    </div>

                    <div class="color-picker-group">
                        <button class="btn-color-main" id="btnColorTxMain" onclick="ColorManager.applyLast('text')">
                            <script>document.getElementById('btnColorTxMain').title = I18n.t('toolbar.text_color');</script>
                            <span style="font-weight:bold">A</span>
                            <div id="txBar" class="btn-color-bar tx-c6"></div>
                        </button>
                        <button id="btnTxMenu" class="btn-color-arrow" onclick="ColorManager.openColorMenu(event, 'btnTxMenu', 'text')">▼</button>
                    </div>

                    <div class="color-picker-group" style="border:none;">
                        <button id="btnFormatTMenu" class="btn-color-main" onclick="Editor.openTextFormatMenu(event, 'btnFormatTMenu')">
                            <script>document.getElementById('btnFormatTMenu').title = I18n.t('toolbar.typography');</script>
                            <span style="font-weight:bold; font-family: serif; font-size: 1.1em;">T</span>
                        </button>
                        <button class="btn-color-arrow" onclick="Editor.openTextFormatMenu(event, 'btnFormatTMenu')">▼</button>
                    </div>

                    <div class="separator" style="height:38px;"></div>

                    <button id="btnFormatH1" onclick="Editor.toggleHeader('h1')">
                        <script>document.write(Icons.h1); document.getElementById('btnFormatH1').title = I18n.t('toolbar.h1');</script>
                    </button>
                    <button id="btnFormatH2" onclick="Editor.toggleHeader('h2')">
                        <script>document.write(Icons.h2); document.getElementById('btnFormatH2').title = I18n.t('toolbar.h2');</script>
                    </button>
                    <button id="btnFormatQuote" onclick="Editor.toggleBlockquote()">
                        <script>document.write(Icons.quote); document.getElementById('btnFormatQuote').title = I18n.t('toolbar.quote');</script>
                    </button>

                    <div class="color-picker-group" style="border:none;">
                        <button id="btnListMenu" class="btn-color-main" onclick="event.preventDefault(); event.stopPropagation(); Editor.toggleActiveList(event)" style="padding:5px;">
                            <script>document.getElementById('btnListMenu').title = I18n.t('toolbar.lists');</script>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="8" y1="6" x2="21" y2="6"></line>
                                <line x1="8" y1="12" x2="21" y2="6"></line>
                                <line x1="8" y1="18" x2="21" y2="18"></line>
                                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                                <line x1="3" y1="18" x2="3.01" y2="18"></line>
                            </svg>
                        </button>
                        <button id="btnListArrow" class="btn-color-arrow" onclick="Editor.openListMenu(event, 'btnListMenu')">▼</button>
                    </div>

                    <div class="separator" style="height:38px;"></div>

                    <div class="color-picker-group" style="border:none;">
                        <button id="btnInsertMenu" class="btn-color-main" onclick="Editor.openInsertMenu(event, 'btnInsertMenu')" style="padding:5px; flex-direction:row; gap:5px;">
                            <script>document.getElementById('btnInsertMenu').title = I18n.t('toolbar.insert_title');</script>
                            <span style="color:var(--accent-color);"><script>document.write(Icons.plus)</script></span>
                            <span style="font-size:0.8rem; font-weight:bold;"><script>document.write(I18n.t('toolbar.insert'))</script></span>
                        </button>
                        <button class="btn-color-arrow" onclick="Editor.openInsertMenu(event, 'btnInsertMenu')">▼</button>
                    </div>

                    <div class="color-picker-group" style="border:none;">
                        <button id="btnWidgetsMenu" class="btn-color-main" onclick="Editor.openWidgetsMenu(event, 'btnWidgetsMenu')" style="padding:5px; flex-direction:row; gap:5px;">
                            <script>document.getElementById('btnWidgetsMenu').title = I18n.t('toolbar.blocks_title');</script>
                            <span style="color:var(--tx-c4);"><script>document.write(Icons.tableSimple)</script></span>
                            <span style="font-size:0.8rem; font-weight:bold;"><script>document.write(I18n.t('toolbar.blocks'))</script></span>
                        </button>
                        <button class="btn-color-arrow" onclick="Editor.openWidgetsMenu(event, 'btnWidgetsMenu')">▼</button>
                    </div>

                    <input type="file" id="imgUpload" accept="image/*" style="display:none" onchange="Editor.handleImageUpload(this)">
                    <input type="file" id="audioUpload" accept="audio/*" style="display:none" onchange="AudioManager.handleUpload(this)">

                    <button id="btnContextEdit" onclick="Editor.editContextElement()"
                        style="color:var(--accent-color); font-weight:bold; display:none; margin-left:auto;">
                        <script>document.getElementById('btnContextEdit').title = I18n.t('toolbar.context_edit_title');</script>
                        <span style="display:inline-flex; align-items:center; gap:5px;"><script>document.write(Icons.editTbl)</script> <script>document.write(I18n.t('toolbar.context_edit'))</script></span>
                    </button>
                </div>

                <div style="display:flex; flex:1; overflow:hidden; position:relative;">
                    
                    <div class="editor-scroll-content" id="editorScrollContent">
                        <div class="meta-bar">
                            <span id="breadcrumb" style="display:flex; align-items:center; gap:5px;">Path</span>
                            <div class="controls-group">
                                <span id="noteLastUpdate"
                                    style="font-size:0.75rem; color:var(--text-secondary); margin-right:10px;"></span>
                                
                                <div style="position: relative;">
                                    <button id="btnNoteOptions" class="icon-btn" onclick="UI.openNoteOptionsMenu(event, 'btnNoteOptions')">
                                        <script>document.write(Icons.dotsVertical); document.getElementById('btnNoteOptions').title = I18n.t('toolbar.note_options');</script>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <input type="text" id="noteTitle" name="dummy_title_field" class="title-input" readonly autocomplete="off" spellcheck="false"
                            oninput="UI.updateCurrentNote()">
                        <script>document.getElementById('noteTitle').placeholder = I18n.t('editor.note_title_placeholder');</script>

                        <div id="noteContent" class="editor-content monospace" contenteditable="false">
                        </div>

                        <div id="emptyNoteOverlay" class="empty-note-overlay" style="display: none;">
                            <div class="empty-overlay-text"><script>document.write(I18n.t('toolbar.template_hint'))</script></div>
                            <div id="templateGrid" class="template-grid"></div>
                        </div>

                        <div id="subNotesFooter" class="subnotes-section hidden"></div>
                    </div>

                    <div id="minimapContainer" class="hidden">
                        <div id="minimapContentWrapper">
                            <div id="minimapContent"></div>
                        </div>
                        <div id="minimapViewport"></div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- VISTA MAPPA DELLE CONNESSIONI INTEGRATA A SCHERMO INTERO -->
    <div id="graphFullscreenView" class="graph-fullscreen-overlay" style="display:none;">
        <header class="graph-header">
            <div class="header-left">
                <span class="graph-brand-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="6" cy="6" r="3"></circle>
                        <circle cx="18" cy="6" r="3"></circle>
                        <circle cx="12" cy="18" r="3"></circle>
                        <line x1="8.5" y1="7.5" x2="15.5" y2="7.5"></line>
                        <line x1="7.5" y1="8.5" x2="10.5" y2="15.5"></line>
                        <line x1="16.5" y1="8.5" x2="13.5" y2="15.5"></line>
                    </svg>
                </span>
                <span id="graphWorkspaceLabel" class="graph-workspace-name">Mappa delle Connessioni</span>
                <span id="graphStatsBadge" class="graph-badge">0 nodi &bull; 0 collegamenti</span>

                <!-- CONTROLLI RAPIDI MODALITÀ GRAFO A DUE STATI: GLOBALE VS LOCALE (3X) -->
                <div class="graph-mode-pill" style="margin-left: 6px;">
                    <button id="btnGraphModeGlobal" class="graph-mode-btn active" onclick="GraphUI.setGraphMode('global')" title="Visualizza l'intero Workspace">
                        Globale
                    </button>

                    </svg>
                    <span>Filtri & Forze</span>
                </button>

            </div>
        </header>
